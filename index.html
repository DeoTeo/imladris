<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171521">
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ainulindalë">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.PNG">
<title>Cronaca del Giorno negli Annali degli Eldar</title>
<style>
:root{
--bg1:#171521;
--bg2:#302845;
--primary:#F5E7B2;
--secondary:#C8BEDA;
--accent:#E8C75A;
--card:rgba(255,255,255,.055);
--border:rgba(232,199,90,.18);
}
*{box-sizing:border-box}
html{margin:0;padding:0;min-height:100%;background:var(--bg1)}
body{
margin:0;
min-height:100vh;
min-height:100dvh;
background:radial-gradient(circle at top,var(--bg2),var(--bg1) 65%);
color:var(--primary);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
padding-top:env(safe-area-inset-top);
padding-bottom:env(safe-area-inset-bottom);
}
.page{width:100%;max-width:760px;margin:auto;padding:45px 22px 70px}
.header{text-align:center}
.header-symbol{font-size:42px;color:var(--accent);margin-bottom:18px}
.header-title{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.4px}
.header-subtitle{margin-top:12px;font-size:15px;font-style:italic;color:var(--secondary)}
.divider{margin:30px 0;text-align:center;color:var(--accent);opacity:.75;letter-spacing:4px}
.hero{text-align:center;padding:28px 18px;border:1px solid var(--border);border-radius:24px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero-period{font-size:31px;font-weight:700}
.hero-day{margin-top:8px;font-size:17px;color:var(--secondary)}
.hero-poetic{margin-top:18px;font-size:15px;font-style:italic;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.card{padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--card)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);margin-bottom:9px}
.value{font-size:17px;font-weight:600;line-height:1.35}
.secondary{margin-top:5px;font-size:13px;line-height:1.5;color:var(--secondary)}
.chronicle{margin-top:16px;padding:25px;border:1px solid var(--border);border-radius:22px;background:var(--card)}
.chronicle-title{text-align:center;font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:var(--accent);margin-bottom:20px}
.chronicle p{font-size:16px;line-height:1.8;color:var(--secondary);margin:0 0 18px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.quote{margin-top:20px;text-align:center;font-size:16px;line-height:1.7;font-style:italic;color:var(--primary)}
.footer{margin-top:40px;text-align:center;color:var(--secondary);opacity:.7;font-size:12px;line-height:1.7}
#elven-loader{
position:fixed;
inset:0;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at center,#302845 0%,#171521 70%,#10101a 100%);
opacity:1;
visibility:visible;
transition:opacity .8s ease,visibility .8s ease;
}
#elven-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-content{position:relative;width:230px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.elven-orbit{
position:absolute;
width:135px;
height:135px;
border:1px solid rgba(232,199,90,.25);
border-radius:50%;
animation:orbitAppear 1.5s ease-out forwards,orbitRotate 12s linear infinite;
}
.elven-orbit:before,.elven-orbit:after{
content:"✦";
position:absolute;
color:#E8C75A;
font-size:13px;
text-shadow:0 0 8px rgba(232,199,90,.75);
}
.elven-orbit:before{top:-8px;left:50%;transform:translateX(-50%)}
.elven-orbit:after{bottom:-8px;left:50%;transform:translateX(-50%)}
.elven-symbol{
position:relative;
width:90px;
height:90px;
display:flex;
align-items:center;
justify-content:center;
color:#E8C75A;
font-size:52px;
text-shadow:0 0 10px rgba(232,199,90,.35),0 0 25px rgba(232,199,90,.18);
animation:symbolAppear 1.4s cubic-bezier(.2,.8,.2,1) forwards;
}
.elven-symbol:before{
content:"✧";
position:absolute;
font-size:82px;
opacity:.16;
transform:rotate(45deg) scale(.8);
animation:symbolGlow 2.2s ease-in-out infinite alternate;
}
.elven-symbol:after{
content:"☾";
position:absolute;
font-size:26px;
right:-8px;
top:3px;
opacity:0;
animation:moonAppear 1.8s ease-out .4s forwards;
}
.elven-star{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:#F5E7B2;
box-shadow:0 0 6px #E8C75A,0 0 14px rgba(232,199,90,.8);
animation:starOrbit 3.8s linear infinite;
}
.loader-title{
position:absolute;
top:184px;
width:100%;
color:#F5E7B2;
font-size:20px;
font-weight:600;
letter-spacing:5px;
opacity:0;
animation:textAppear 1s ease-out .7s forwards;
margin-top: 25px
}
.loader-subtitle{
position:absolute;
top:217px;
width:100%;
color:#C8BEDA;
font-size:11px;
font-style:italic;
letter-spacing:1.5px;
opacity:0;
animation:textAppear 1s ease-out 1s forwards;
}
@keyframes orbitAppear{
from{opacity:0;transform:scale(.55)}
to{opacity:1;transform:scale(1)}
}
@keyframes orbitRotate{
from{rotate:0deg}
to{rotate:360deg}
}
@keyframes symbolAppear{
0%{opacity:0;transform:scale(.3) rotate(-25deg)}
60%{opacity:1;transform:scale(1.12) rotate(5deg)}
100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes symbolGlow{
from{opacity:.08;transform:rotate(45deg) scale(.75)}
to{opacity:.25;transform:rotate(225deg) scale(1)}
}
@keyframes moonAppear{
from{opacity:0;transform:translate(10px,-5px) rotate(-30deg)}
to{opacity:.8;transform:translate(0,0) rotate(0deg)}
}
@keyframes starOrbit{
from{transform:rotate(0deg) translateX(78px) rotate(0deg)}
to{transform:rotate(360deg) translateX(78px) rotate(-360deg)}
}
@keyframes textAppear{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
#elven-loader,.elven-orbit,.elven-symbol,.elven-symbol:before,.elven-symbol:after,.elven-star,.loader-title,.loader-subtitle{animation:none!important}
}
@media(max-width:520px){
.page{padding:35px 16px 55px}
.header-title{font-size:24px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{padding:16px}
.hero-period{font-size:28px}
}
</style>
</head>
<body>
<div id="elven-loader">
<div class="loader-content">
<div class="elven-orbit"></div>
<div class="elven-star"></div>
<div class="elven-symbol">✦</div>
<div class="loader-title">AINULINDALË</div>
<div class="loader-subtitle">Annali degli Eldar</div>
</div>
</div>
<div class="page">
<header class="header">
<div class="header-symbol">✦</div>
<div class="header-title">Cronaca del Giorno</div>
<div class="header-subtitle">Computo del Tempo secondo gli Annali degli Eldar</div>
</header>
<div class="divider">✦ ─────── ✧ ─────── ✦</div>
<section class="hero">
<div id="periodo" class="hero-period"></div>
<div id="giorno" class="hero-day"></div>
<div id="poetico" class="hero-poetic"></div>
</section>
<div class="grid">
<div class="card">
<div class="label">Giorno degli Eldar</div>
<div id="giornoElfico" class="value"></div>
<div id="significatoGiorno" class="secondary"></div>
</div>
<div class="card">
<div class="label">Computo del Loa</div>
<div id="loa" class="value"></div>
<div id="quartaEra" class="secondary"></div>
</div>
<div class="card">
<div class="label">Isil</div>
<div id="luna" class="value"></div>
<div id="lunaItaliano" class="secondary"></div>
</div>
<div class="card">
<div class="label">Albero Sacro</div>
<div id="albero" class="value"></div>
</div>
<div class="card">
<div class="label">Stella del Giorno</div>
<div id="stella" class="value"></div>
<div id="descrizioneStella" class="secondary"></div>
</div>
<div class="card">
<div class="label">Costellazione</div>
<div id="costellazione" class="value"></div>
<div id="descrizioneCostellazione" class="secondary"></div>
</div>
</div>
<section class="chronicle">
<div class="chronicle-title">✧ Dal Libro degli Annali ✧</div>
<p id="testo"></p>
<div class="quote" id="citazione"></div>
</section>
<div class="divider">✦ ─────── ✧ ─────── ✦</div>
<div class="footer" id="footer"></div>
</div>
<script>
const data=new Date();
const ora=data.getHours();
const dark=ora>=22||ora<7;
function getFaseLunareElfica(){
const riferimento=new Date("2000-01-06T18:14:00Z");
const giorni=(data.getTime()-riferimento.getTime())/86400000;
const etaLuna=((giorni%29.530588)+29.530588)%29.530588;
if(etaLuna<1.84566)return{simbolo:"🌑",nome:"Isil Núra",italiano:"Luna Nuova"};
if(etaLuna<5.53699)return{simbolo:"🌒",nome:"Isil Orta",italiano:"Falce Crescente"};
if(etaLuna<9.22831)return{simbolo:"🌓",nome:"Perian Isil",italiano:"Primo Quarto"};
if(etaLuna<12.91963)return{simbolo:"🌔",nome:"Isil Alata",italiano:"Gibbosa Crescente"};
if(etaLuna<16.61096)return{simbolo:"🌕",nome:"Isil Rána",italiano:"Luna Piena"};
if(etaLuna<20.30228)return{simbolo:"🌖",nome:"Isil Lanta",italiano:"Gibbosa Calante"};
if(etaLuna<23.99361)return{simbolo:"🌗",nome:"Perian Isil Núnquerna",italiano:"Ultimo Quarto"};
if(etaLuna<27.68493)return{simbolo:"🌘",nome:"Isil Núrala",italiano:"Falce Calante"};
return{simbolo:"🌑",nome:"Isil Núra",italiano:"Luna Nuova"};
}
const faseLunare=getFaseLunareElfica();
const giorniElfici=[
{nome:"Elenya",significato:"Giorno delle Stelle"},
{nome:"Anarya",significato:"Giorno del Sole"},
{nome:"Isilya",significato:"Giorno della Luna"},
{nome:"Aldúya",significato:"Giorno dei Due Alberi"},
{nome:"Menelya",significato:"Giorno dei Cieli"},
{nome:"Valanya",significato:"Giorno dei Valar"}
];
const annoGreg=data.getFullYear();
let yestare=new Date(annoGreg,2,21);
let annoElfico;
if(data>=yestare){annoElfico=annoGreg}else{annoElfico=annoGreg-1;yestare=new Date(annoGreg-1,2,21)}
let enderi=3;
const multiplo12=annoElfico%12===0;
const multiplo432=annoElfico%432===0;
if(multiplo12&&!multiplo432)enderi=6;
const giornoAnno=Math.floor((data.getTime()-yestare.getTime())/86400000);
const nomeGiorno=giorniElfici[((giornoAnno%6)+6)%6];
const stelleDelGiorno={
Elenya:{nome:"Eärendil",descrizione:"la Stella del Vespro"},
Anarya:{nome:"Anar",descrizione:"il Sole Dorato"},
Isilya:{nome:"Isil",descrizione:"la Luna Bianca"},
Aldúya:{nome:"Telperion e Laurelin",descrizione:"i Due Alberi di Valinor"},
Menelya:{nome:"Menelmacar",descrizione:"il Guerriero Celeste"},
Valanya:{nome:"Elbereth Gilthoniel",descrizione:"la Signora delle Stelle"}
};
const stellaDelGiorno=stelleDelGiorno[nomeGiorno.nome];
const nomeStella=stellaDelGiorno.nome;
const descrizioneStella=stellaDelGiorno.descrizione;
const calendario=[
{nome:"Yestarë",sindarin:"",significato:"Primo giorno dell'anno",simbolo:"✦",durata:1,stagione:"yestare"},
{nome:"Tuilë",sindarin:"Ethuil",significato:"Primavera",simbolo:"❧",durata:54,stagione:"tuile"},
{nome:"Lairë",sindarin:"Laer",significato:"Estate",simbolo:"☼",durata:72,stagione:"laire"},
{nome:"Yávië",sindarin:"Iavas",significato:"Autunno",simbolo:"❦",durata:54,stagione:"yavie"},
{nome:"Enderi",sindarin:"",significato:"Giorni centrali dell'anno",simbolo:"✧",durata:enderi,stagione:"enderi"},
{nome:"Quellë",sindarin:"Firith",significato:"Fine dell'autunno",simbolo:"❋",durata:54,stagione:"quelle"},
{nome:"Hrívë",sindarin:"Rhîw",significato:"Inverno",simbolo:"❄",durata:72,stagione:"hrive"},
{nome:"Coirë",sindarin:"Echuir",significato:"Risveglio della primavera",simbolo:"✿",durata:54,stagione:"coire"},
{nome:"Mettarë",sindarin:"",significato:"Ultimo giorno dell'anno",simbolo:"✺",durata:1,stagione:"mettare"}
];
let restante=giornoAnno;
let periodo=null;
let giornoPeriodo=1;
for(const elemento of calendario){
if(restante<elemento.durata){periodo=elemento;giornoPeriodo=restante+1;break}
restante-=elemento.durata;
}
const costellazioni=["Menelmacar","Valacirca","Wilwarin","Remmirath","Soronúmë","Telumendil","Anarríma","Elenath"];
const indiceCostellazione=Math.floor(giornoAnno/45)%costellazioni.length;
const costellazione=costellazioni[indiceCostellazione];
const descrizioniCostellazioni={
Menelmacar:"il Guerriero del Cielo",
Valacirca:"la Falce dei Valar",
Wilwarin:"la Farfalla Stellata",
Remmirath:"la Rete delle Stelle",
Soronúmë:"l'Aquila Occidentale",
Telumendil:"l'Amante della Volta Celeste",
Anarríma:"ai Confini del Sole",
Elenath:"l'Ospite delle Stelle"
};
const descrizioneCostellazione=descrizioniCostellazioni[costellazione];
let nomePoetico="Tempo degli Eldar";
switch(periodo.nome){
case"Yestarë":nomePoetico="Il Rinnovarsi della Luce";break;
case"Tuilë":nomePoetico="Tempo dei Primi Germogli";break;
case"Lairë":nomePoetico="Tempo della Piena Luce";break;
case"Yávië":nomePoetico="Tempo della Raccolta";break;
case"Enderi":nomePoetico="Giorni fuori dal Tempo";break;
case"Quellë":nomePoetico="Tempo delle Foglie Cadenti";break;
case"Hrívë":nomePoetico="Tempo del Gelo e delle Stelle";break;
case"Coirë":nomePoetico="Tempo del Risveglio";break;
case"Mettarë":nomePoetico="Il Compimento dell’Anno";break;
}
const alberiSacri={
Yestarë:"🌳 Galathilion",
Tuilë:"🌿 Mallorn",
Lairë:"☀️ Laurelin",
Yávië:"🍎 Galmadh",
Enderi:"✨ I Due Alberi",
Quellë:"🍂 Hirilorn",
Hrívë:"🌙 Telperion",
Coirë:"🌱 Nimloth",
Mettarë:"🌳 Galathilion"
};
const alberoSacro=alberiSacri[periodo.nome];
const palettes={
yestare:{
dark:{bg1:"#171521",bg2:"#302845",primary:"#F5E7B2",secondary:"#C8BEDA",accent:"#E8C75A"},
light:{bg1:"#F9F5E8",bg2:"#E8DDC1",primary:"#4A3A22",secondary:"#76684F",accent:"#C49A27"}
},
tuile:{
dark:{bg1:"#15251F",bg2:"#294437",primary:"#E5F0D8",secondary:"#B7CCB7",accent:"#78B86A"},
light:{bg1:"#F2F7ED",bg2:"#DCEBD3",primary:"#31452E",secondary:"#65745F",accent:"#4F963F"}
},
laire:{
dark:{bg1:"#172333",bg2:"#354C61",primary:"#F6E9B8",secondary:"#C5D1D9",accent:"#E2B84B"},
light:{bg1:"#F7F5E9",bg2:"#E4E0C8",primary:"#493D25",secondary:"#716A58",accent:"#C99724"}
},
yavie:{
dark:{bg1:"#291D18",bg2:"#51372A",primary:"#F1D8B5",secondary:"#CBB5A0",accent:"#D88743"},
light:{bg1:"#F8F0E5",bg2:"#E8D3B9",primary:"#513723",secondary:"#786653",accent:"#B96F32"}
},
enderi:{
dark:{bg1:"#211C2B",bg2:"#44384F",primary:"#F2E4C7",secondary:"#C8BFD0",accent:"#D7B86A"},
light:{bg1:"#F6F1E7",bg2:"#E3D8C7",primary:"#493D32",secondary:"#746B60",accent:"#B28B38"}
},
quelle:{
dark:{bg1:"#251C19",bg2:"#493128",primary:"#EFD7C1",secondary:"#C8AEA0",accent:"#C56B43"},
light:{bg1:"#F7EEE7",bg2:"#E6D0C1",primary:"#503629",secondary:"#766055",accent:"#A95532"}
},
hrive:{
dark:{bg1:"#141E2B",bg2:"#2B4055",primary:"#E3EDF4",secondary:"#B6C7D6",accent:"#8FC4E8"},
light:{bg1:"#F0F5F8",bg2:"#D9E6ED",primary:"#30414D",secondary:"#657580",accent:"#5797BF"}
},
coire:{
dark:{bg1:"#18251F",bg2:"#30483A",primary:"#E3EEDB",secondary:"#B9CBB8",accent:"#79A86A"},
light:{bg1:"#F3F7EF",bg2:"#DDE9D5",primary:"#34472F",secondary:"#687661",accent:"#5A934D"}
},
mettare:{
dark:{bg1:"#1D1827",bg2:"#392A48",primary:"#F2E2B7",secondary:"#C7BBD2",accent:"#D8B45A"},
light:{bg1:"#F8F3E8",bg2:"#E4D8C5",primary:"#4C3A25",secondary:"#74695A",accent:"#B48A2C"}
}
};
const palette=palettes[periodo.stagione][dark?"dark":"light"];
document.documentElement.style.setProperty("--bg1",palette.bg1);
document.documentElement.style.setProperty("--bg2",palette.bg2);
document.documentElement.style.setProperty("--primary",palette.primary);
document.documentElement.style.setProperty("--secondary",palette.secondary);
document.documentElement.style.setProperty("--accent",palette.accent);
document.body.style.background=`radial-gradient(circle at top,${palette.bg2},${palette.bg1} 65%)`;
document.documentElement.style.setProperty("--border",dark?"rgba(255,255,255,.12)":"rgba(90,70,30,.18)");
document.documentElement.style.setProperty("--card",dark?"rgba(255,255,255,.055)":"rgba(255,255,255,.42)");
document.getElementById("periodo").textContent=periodo.simbolo+" "+periodo.nome;
document.getElementById("giorno").textContent=giornoPeriodo+"° giorno · "+(periodo.sindarin||periodo.significato);
document.getElementById("poetico").textContent=nomePoetico;
document.getElementById("giornoElfico").textContent=nomeGiorno.nome;
document.getElementById("significatoGiorno").textContent=nomeGiorno.significato;
document.getElementById("loa").textContent="Loa "+annoElfico;
const annoQuartaEra=annoGreg+4021;
document.getElementById("quartaEra").textContent=annoQuartaEra+" Q.E.";
document.getElementById("luna").textContent=faseLunare.simbolo+" "+faseLunare.nome;
document.getElementById("lunaItaliano").textContent=faseLunare.italiano;
document.getElementById("albero").textContent=alberoSacro;
document.getElementById("stella").textContent="⭐ "+nomeStella;
document.getElementById("descrizioneStella").textContent=descrizioneStella;
document.getElementById("costellazione").textContent="✨ "+costellazione;
document.getElementById("descrizioneCostellazione").textContent=descrizioneCostellazione;
const cronaca=`
🍂 Oggi ricorre ${nomeGiorno.nome}, il ${giornoPeriodo}° di ${periodo.nome}, ${periodo.sindarin?`chiamato ${periodo.sindarin} dagli Elfi Sindar, `:""}nella stagione conosciuta tra gli Uomini come ${periodo.significato}, in cui vengono registrati i moti del tempo e del cielo secondo l'antico computo degli Eldar.
<br><br>
📖 Questo è il tempo denominato ${nomePoetico}, quando le potenze della natura seguono il ciclo ordinato posto in principio dai Valar e custodito nella memoria degli Elfi.
<br><br>
${alberoSacro.split(" ")[0]} Sotto la protezione di ${alberoSacro.split(" ")[1]} si svolge questa stagione e il suo simbolo richiama le virtù proprie di questo periodo dell'anno.
<br><br>
🌑 ${faseLunare.nome}, ${faseLunare.italiano}. Così appare Isil nei cieli di Arda, mentre il suo corso continua immutabile attraverso le ere del mondo.
<br><br>
⭐ La luce di ${nomeStella}, ${descrizioneStella}, veglia su questo giorno, guidando lo sguardo di coloro che cercano nei cieli memoria, speranza e conoscenza.
<br><br>
✨ Nelle alte regioni del firmamento risplende ${costellazione}; ${descrizioneCostellazione}; la sua presenza è considerata di buon auspicio e ricorda agli osservatori la grande armonia delle stelle.
<br><br>
🌳 Questo giorno appartiene all'anno elfico ${annoElfico} e corrisponde all'anno ${annoQuartaEra} della Quarta Era secondo il computo del Reame Riunito.
<br><br>
Così viene annotato questo giorno negli annali degli Eldar, affinché il ricordo del cielo, delle stagioni e delle antiche luci non venga meno finché durerà il mondo.
`;
document.getElementById("testo").innerHTML=cronaca;
document.getElementById("citazione").textContent=periodo.simbolo;
document.getElementById("footer").textContent="Loa "+annoElfico+" · "+annoQuartaEra+" Q.E.";
document.title="Cronaca del Giorno — "+periodo.nome;
const prossimoAggiornamento=new Date(data);
prossimoAggiornamento.setHours(data.getHours()+1);
prossimoAggiornamento.setMinutes(0);
prossimoAggiornamento.setSeconds(0);
prossimoAggiornamento.setMilliseconds(0);
const tempo=prossimoAggiornamento.getTime()-data.getTime();
setTimeout(()=>{location.reload()},tempo);
</script>
<script>
if("serviceWorker"in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./sw.js");
});
}
